name: Build PolyBandit images

# Builds one image (bzImage + rootfs.cpio.gz) per PolyBandit version:
#   v3    the original game in bandit/
#   v3.1  giacobe/polybandit3.1, kept as a git subtree in polybandit3.1/
# Both use the same Buildroot baseline (cached, built once):
#   01-setup-buildroot.sh  -> download Buildroot
#   02-build-baseline.sh   -> build kernel + baseline rootfs
#   03-package-payload.sh  -> merge the variant's folder into /root
# Each image is then tested (image check, QEMU boot test, browser play test of
# the v86 page). Pushes to the default branch publish both pages to GitHub
# Pages: /v3/, /v3.1/ and a landing page at the root.

on:
  push:
    branches: [main, master]
    tags: ['v*']          # path filters below don't apply to tag pushes
    paths-ignore: ['**.md', 'LICENSE']
  # No path filters on PRs: the build checks are required, so they must report
  # on every PR, even docs-only ones.
  pull_request:
  schedule:
    # Weekly run keeps the baseline cache alive (GitHub evicts caches unused
    # for 7 days). With a warm cache this is a few minutes of packaging + tests.
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      config_set:
        description: buildroot-builder2 config set
        default: basic-compression
        type: choice
        options: [basic, basic-compression, basic-compression-networking, basic-processes]
      buildroot_version:
        description: Buildroot release (config sets are validated on 2025.02.15)
        default: '2025.02.15'
      builder_ref:
        description: Branch, tag or commit of giacobe/buildroot-builder2 (blank = pinned commit)
        default: ''
      baseline_tag:
        description: Baseline release to package on (blank = pinned BASELINE_TAG, else a promoted release matching the config)
        default: ''
      allow_prerelease_baseline:
        description: Allow a pre-release baseline (to test one before promoting it)
        type: boolean
        default: false
      force_rebuild:
        description: Ignore published and cached baselines and rebuild from source
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs. Cancelling a push run mid-baseline would
  # throw away up to an hour of Buildroot work before it reaches the cache.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write   # needed only to attach images to a release on tag pushes

env:
  # basic-compression covers what both versions call: tar, gzip, bzip2, xxd,
  # strings, base64, file, md5sum, sha256sum (hexdump is a BusyBox applet).
  CONFIG_SET: ${{ inputs.config_set || 'basic-compression' }}
  BUILDROOT_VERSION: ${{ inputs.buildroot_version || '2025.02.15' }}
  # Pinned so builder changes only reach these images when you bump this SHA.
  # To update: use the latest commit from github.com/giacobe/buildroot-builder2.
  BUILDER_REF: ${{ inputs.builder_ref || 'b6fb25fcadbd536a64ca7116f1c12e6daa7b5fd8' }}
  V86_VERSION: '0.5.473'
  # Known-good base to package on, published by baseline.yml. Set this to a
  # promoted release tag to pin it. Blank: use a promoted release whose config
  # hash matches, if there is one, else the cache, else build from source.
  BASELINE_TAG: ${{ inputs.baseline_tag || '' }}
  BASELINE_REPO: ${{ github.repository }}   # or another repo that publishes baselines

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: v3
            flavor: v3                      # boot-test.py / verify-image.sh mode
            payload_dir: bandit             # folder packaged into /root
            installer: installbandit.sh     # becomes /root/install.sh
            output_prefix: polybandit3
            solvers: ''                     # no reference solvers for v3 yet
          - variant: v3.1
            flavor: v31
            payload_dir: polybandit3.1
            installer: install.sh
            output_prefix: polybandit3.1
            solvers: solvers/polybandit3.1  # run at every level by the boot test
    env:
      VARIANT: ${{ matrix.variant }}
      FLAVOR: ${{ matrix.flavor }}
      PAYLOAD_DIR: ${{ matrix.payload_dir }}
      INSTALLER: ${{ matrix.installer }}
      OUTPUT_PREFIX: ${{ matrix.output_prefix }}
      SOLVERS: ${{ matrix.solvers }}
    steps:
      - name: Check out payload (this repo)
        uses: actions/checkout@v6
        with:
          path: payload
          fetch-depth: 0   # 03-package-payload.sh clones this and checks out the SHA

      - name: Lab self-test (test.sh)
        if: matrix.flavor == 'v31'
        working-directory: payload/${{ matrix.payload_dir }}
        run: sh test.sh

      - name: Check out buildroot-builder2
        uses: actions/checkout@v6
        with:
          repository: giacobe/buildroot-builder2
          ref: ${{ env.BUILDER_REF }}
          path: builder

      - name: Drop Buildroot's host QEMU (CI installs QEMU from apt instead)
        run: |
          # BR2_PACKAGE_HOST_QEMU only builds a QEMU for local boot testing; it
          # adds a long host build and doesn't change bzImage or rootfs.cpio.gz.
          for f in builder/config-sets/"$CONFIG_SET"/defconfig builder/config-sets/"$CONFIG_SET"/features.fragment; do
            [ -f "$f" ] && sed -i '/^BR2_PACKAGE_HOST_QEMU/d' "$f"
          done
          ! grep -h '^BR2_PACKAGE_HOST_QEMU' builder/config-sets/"$CONFIG_SET"/*

      - name: Compute baseline cache key
        id: key
        run: |
          h=$(cat builder/config-sets/"$CONFIG_SET"/* builder/scripts/02-build-baseline.sh | sha256sum | cut -c1-16)
          echo "baseline=baseline-${CONFIG_SET}-br${BUILDROOT_VERSION}-${h}" >> "$GITHUB_OUTPUT"

      - name: Use published baseline release
        id: published
        if: ${{ !inputs.force_rebuild }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PRE: ${{ inputs.allow_prerelease_baseline }}
          KEY: ${{ steps.key.outputs.baseline }}
        run: |
          pinned=$BASELINE_TAG
          h=${KEY##*-}
          tag=${pinned:-baseline-${CONFIG_SET}-br${BUILDROOT_VERSION}-${h:0:10}}
          if ! info=$(gh release view "$tag" -R "$BASELINE_REPO" --json isPrerelease 2>/dev/null); then
            [ -z "$pinned" ] || { echo "::error::Pinned baseline $tag not found in $BASELINE_REPO"; exit 1; }
            echo "No published baseline $tag; using cache or building."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$(jq -r .isPrerelease <<<"$info")" = true ] && [ "$ALLOW_PRE" != true ]; then
            if [ -n "$pinned" ]; then
              echo "::error::$tag is a pre-release (not yet promoted). Check allow_prerelease_baseline to test it."; exit 1
            fi
            echo "::notice::$tag exists but is not promoted yet; using cache or building."
            echo "found=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh release download "$tag" -R "$BASELINE_REPO" -D dl \
            -p bzImage -p rootfs.cpio.gz -p baseline-manifest.tar.gz -p baseline.json -p SHA256SUMS
          (cd dl && sha256sum -c SHA256SUMS)
          mkdir -p baseline/images
          mv dl/bzImage dl/rootfs.cpio.gz baseline/images/
          tar -xzf dl/baseline-manifest.tar.gz -C baseline
          cp dl/baseline.json baseline/manifest/
          if [ -z "$pinned" ] && [ "$(jq -r .config_hash dl/baseline.json)" != "$h" ]; then
            echo "::error::$tag was built from a different config (hash mismatch)"; exit 1
          fi
          echo "Using baseline release $tag from $BASELINE_REPO"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore cached baseline
        id: baseline-cache
        if: ${{ !inputs.force_rebuild && steps.published.outputs.found != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: baseline
          key: ${{ steps.key.outputs.baseline }}

      - name: Decide whether to build the baseline
        id: need
        env:
          PUBLISHED: ${{ steps.published.outputs.found }}
          CACHED: ${{ steps.baseline-cache.outputs.cache-hit }}
          TAG: ${{ steps.published.outputs.tag }}
        run: |
          if [ "$PUBLISHED" = true ]; then src="release \`$TAG\`"; build=false
          elif [ "$CACHED" = true ]; then src="Actions cache"; build=false
          else src="built from source in this run"; build=true; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "**${VARIANT}** packaged on baseline: $src" >> "$GITHUB_STEP_SUMMARY"
          echo "Baseline source: $src"

      - name: Free disk space for Buildroot
        if: steps.need.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Restore Buildroot download cache
        if: steps.need.outputs.build == 'true'
        uses: actions/cache@v5
        with:
          path: br-dl
          key: br-dl-${{ env.BUILDROOT_VERSION }}-${{ steps.key.outputs.baseline }}
          restore-keys: br-dl-${{ env.BUILDROOT_VERSION }}-

      - name: Set up Buildroot
        if: steps.need.outputs.build == 'true'
        run: bash builder/scripts/01-setup-buildroot.sh

      - name: Build baseline (kernel + rootfs)
        if: steps.need.outputs.build == 'true'
        env:
          BR2_DL_DIR: ${{ github.workspace }}/br-dl
          # JOBS is left unset: 02-build-baseline.sh defaults to every CPU core.
        run: |
          # The builder repo commits its scripts without +x, so call them via bash.
          # Buildroot refuses to run with "." or empty entries in these.
          unset LD_LIBRARY_PATH PERL_MM_OPT
          bash builder/scripts/02-build-baseline.sh --config "$CONFIG_SET"
          dir=$(ls -d builder/artifacts/"$CONFIG_SET"-* | sort | tail -n1)
          mkdir -p baseline
          cp -a "$dir"/. baseline/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: buildroot-logs-${{ matrix.variant }}
          path: builder/artifacts/*/logs/
          if-no-files-found: ignore

      - name: Save baseline cache
        # On a cold cache both variants build the baseline; whichever finishes
        # second only logs a warning that the key already exists.
        if: steps.need.outputs.build == 'true'
        uses: actions/cache/save@v5
        with:
          path: baseline
          key: ${{ steps.key.outputs.baseline }}

      - name: Package ${{ matrix.payload_dir }}/ into /root
        run: |
          rename=()
          [ "$INSTALLER" = install.sh ] || rename=(--rename-to-install "$INSTALLER")
          bash builder/scripts/03-package-payload.sh \
            --repo "$GITHUB_WORKSPACE/payload" \
            --ref "$GITHUB_SHA" \
            --payload-subdir "$PAYLOAD_DIR" \
            --baseline baseline \
            --output out \
            "${rename[@]}" \
            --output-prefix "$OUTPUT_PREFIX" \
            --force

      - name: Verify image contents
        run: |
          bash payload/.github/scripts/verify-image.sh \
            out/"$OUTPUT_PREFIX".rootfs.cpio.gz \
            builder/config-sets/"$CONFIG_SET"/required-commands.txt \
            payload/"$PAYLOAD_DIR" "$INSTALLER" "$FLAVOR"

      - name: Install QEMU for boot test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 python3-pexpect

      - name: Enable KVM (falls back to slower emulation if unavailable)
        id: kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then echo "flag=--kvm" >> "$GITHUB_OUTPUT"; else echo "flag=" >> "$GITHUB_OUTPUT"; fi

      - name: Boot test (log in, run installer, play through levels)
        timeout-minutes: 30
        run: |
          python3 payload/.github/scripts/boot-test.py \
            --flavor "$FLAVOR" \
            --kernel out/"$OUTPUT_PREFIX".bzImage \
            --initrd out/"$OUTPUT_PREFIX".rootfs.cpio.gz \
            --levels 13 --log out/boot.log ${{ steps.kvm.outputs.flag }} \
            ${SOLVERS:+--solvers payload/"$SOLVERS"}

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: boot-log-${{ matrix.variant }}-${{ github.sha }}
          path: out/boot.log
          if-no-files-found: ignore

      - name: Check out v86 BIOS files
        uses: actions/checkout@v6
        with:
          repository: copy/v86
          ref: 315b2b0b758703ef0e6cc7b4088d6068f83f3c20   # pinned; bump with V86_VERSION
          path: v86src
          sparse-checkout: bios
          sparse-checkout-cone-mode: false

      - name: Assemble v86 web page
        run: |
          lab_json=payload/"$PAYLOAD_DIR"/lab.json
          [ -f "$lab_json" ] || lab_json=
          VERSION_NAME="$VARIANT" LAB_JSON="$lab_json" \
            bash payload/.github/scripts/assemble-site.sh out "$OUTPUT_PREFIX" v86src/bios site \
            "${GITHUB_SHA::7} · $(date -u +%Y-%m-%d)"

      - name: Browser test of the web page (headless Chrome)
        timeout-minutes: 15
        run: |
          pt="$RUNNER_TEMP/page-test"
          npm install --prefix "$pt" --silent --no-audit --no-fund puppeteer-core@24
          cp payload/.github/scripts/page-test.mjs "$pt/"
          python3 -m http.server 8080 --directory site --bind 127.0.0.1 >/dev/null 2>&1 &
          node "$pt/page-test.mjs" http://127.0.0.1:8080/ out/page-shots

      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: page-screenshots-${{ matrix.variant }}-${{ github.sha }}
          path: out/page-shots/
          if-no-files-found: ignore

      - name: Upload site for the Pages deploy
        uses: actions/upload-artifact@v6
        with:
          name: site-${{ matrix.variant }}
          path: site/
          retention-days: 7

      - name: Write checksums
        run: cd out && sha256sum "$OUTPUT_PREFIX".bzImage "$OUTPUT_PREFIX".rootfs.cpio.gz | tee SHA256SUMS-"$VARIANT"

      - name: Upload image
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.output_prefix }}-${{ env.CONFIG_SET }}-${{ github.sha }}
          path: |
            out/${{ matrix.output_prefix }}.bzImage
            out/${{ matrix.output_prefix }}.rootfs.cpio.gz
            out/SHA256SUMS-${{ matrix.variant }}
            out/manifest/
            baseline/manifest/
            baseline/configs/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both variants run this; whichever is second finds the release already made.
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes \
            || gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber \
            out/"$OUTPUT_PREFIX".bzImage out/"$OUTPUT_PREFIX".rootfs.cpio.gz out/SHA256SUMS-"$VARIANT"

  deploy:
    name: Deploy to GitHub Pages
    needs: build      # waits for both variants; deploys only if both passed
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out landing page
        uses: actions/checkout@v6
        with:
          sparse-checkout: web
          sparse-checkout-cone-mode: false

      - name: Download both sites
        uses: actions/download-artifact@v7
        with:
          pattern: site-*
          path: sites

      - name: Combine into one Pages site
        run: |
          mkdir -p public
          cp web/landing.html public/index.html
          cp -r sites/site-v3 public/v3
          cp -r sites/site-v3.1 public/v3.1
          find public -maxdepth 2 | sort

      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
